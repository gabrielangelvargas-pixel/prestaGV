name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restaurar herramientas
        run: dotnet tool restore

      - name: Compilar
        run: dotnet build -c Release

      - name: Pruebas
        run: dotnet test -c Release --no-build

      - name: Comprobar que no faltan migraciones
        run: dotnet ef migrations has-pending-model-changes --project src/PrestaGV.Data --no-build --configuration Release
