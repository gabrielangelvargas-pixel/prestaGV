name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Si la descarga falla (por ejemplo, justo tras publicarse una versión nueva de .NET),
      # se sigue con el SDK que ya trae la imagen de Windows; global.json valida que sirva.
      - uses: actions/setup-dotnet@v5
        continue-on-error: true
        with:
          global-json-file: global.json

      - name: SDK de .NET en uso
        run: dotnet --version

      - name: Restaurar herramientas
        run: dotnet tool restore

      - name: Compilar
        run: dotnet build -c Release

      - name: Pruebas
        run: dotnet test -c Release --no-build

      - name: Comprobar que no faltan migraciones
        run: dotnet ef migrations has-pending-model-changes --project src/PrestaGV.Data --no-build --configuration Release
